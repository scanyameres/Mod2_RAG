# Document categories of the knowledge base.
#
# Every uploaded document belongs to exactly one category, and each conversation can switch
# categories on or off (sidebar of the Chat page). Edit this list freely:
# - id: lowercase letters, digits and "_" only. It is the folder name under data/library/ and
#   the value stored with every chunk, so do not rename an id once documents use it
#   (or rebuild the index afterwards on the Knowledge base page).
# - name: shown in the app.
# - description: shown as a tooltip, and told to the chat model.
#
# The invented test documents of sample_data/ use other categories (see sample_data/README.md).

[[category]]
id = "cte"
name = "CTE (national rules, Spain)"
description = "Código Técnico de la Edificación and related national regulations: Documentos Básicos on structural safety (SE: actions, foundations, steel, masonry, timber), energy saving (HE), noise (HR), health (HS), fire safety (SI), safety of use and accessibility (SUA); the thermal installations regulation (RITE) and fire safety in industrial buildings (RSCIEI)."

[[category]]
id = "gencat"
name = "Catalonia (regional rules)"
description = "Regulations of the Generalitat de Catalunya: the Accessibility Code of Catalonia (Decret 209/2023) and the minimum habitability conditions for dwellings (Decret 141/2012)."

[[category]]
id = "poum_terrassa"
name = "Terrassa (municipal plan)"
description = "Urban planning rules of the municipality of Terrassa (POUM, Normes Urbanístiques): zones, permitted uses, building parameters and parking. They take precedence over the general rules on these points."
